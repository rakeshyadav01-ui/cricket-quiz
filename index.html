<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Quiz</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>🏏 Cricket Quiz</h1>
            <p>Test your cricket knowledge!</p>
        </header>

        <main class="quiz-card">

            <!-- Progress -->
            <div class="progress-container">
                <div class="progress-info">
                    <span>Quiz Progress</span>
                    <span id="progressText">0 / 5 answered</span>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Quiz Form -->
            <form id="quizForm"></form>

            <!-- Result -->
            <div id="out" class="result hidden">
                <div id="resultIcon" class="result-icon">🏆</div>

                <h2 id="resultTitle">Quiz Completed!</h2>

                <div class="score">
                    <span id="scoreNumber">0</span>/5
                </div>

                <p id="resultMessage">
                    Great job! Keep practicing.
                </p>

                <button id="restartBtn" class="restart-btn" type="button">
                    🔄 Try Again
                </button>
            </div>

        </main>

    </div>

    <script src="./first.js"></script>
    <script src="./app.js"></script>

</body>
</html>
